# Official Website: https://www.nickuc.com
# Discord: https://www.nickuc.com/discord

# WARNING: This is a translation made to nLogin. It will probably be compatible with all features of OpeNLogin.

# Translation made by Tomac15er#1637

Messages:
  Title:
    # Message sent before login.
    before-login:
      title: "<gradient:#7F5AF0:#2CB67D><bold>Willkommen!</bold></gradient>"
      subtitle: "<#A0A0B0>Benutze /login [dein Passwort]"
      delays:
        start: 0
        duration: 9999
        end: 6
    # Message sent before registration.
    before-register:
      title: "<gradient:#7F5AF0:#2CB67D><bold>Willkommen!</bold></gradient>"
      subtitle: "<#A0A0B0>Benutze /register [dein Passwort] [dein Passwort]"
      delays:
        start: 0
        duration: 9999
        end: 6
    # Message sent after login.
    after-login:
      title: ""
      subtitle: "<#5EC26A>Erfolgreich eingeloggt!"
      delays:
        start: 0
        duration: 60
        end: 6
    # Message sent after registration.
    after-register:
      title: ""
      subtitle: "<#5EC26A>Erfolgreich registriert!"
      delays:
        start: 0
        duration: 60
        end: 6
    # Message sent when you miss a password.
    incorrect-password:
      title: ""
      subtitle: "<#E0575B>Falsches Passwort!"
      delays:
        start: 0
        duration: 60
        end: 6
    # Message sent when already logged in.
    already-login:
      title: ""
      subtitle: "<#E0575B>Du bist bereits eingeloggt!"
      delays:
        start: 0
        duration: 60
        end: 6
    # Message sent when already registered.
    already-registered:
      title: ""
      subtitle: "<#E0575B>Du bist bereits registriert!"
      delays:
        start: 0
        duration: 60
        end: 6
    # Message sent when passwords are not equal.
    passwords-dont-match:
      title: ""
      subtitle: "<#E0575B>Die Passwörter sind nicht gleich!"
      delays:
        start: 0
        duration: 60
        end: 6
    # Message sent when session is continued.
    session-login:
      title: ""
      subtitle: "<#F2C14E>Deine Login Session wurde fortgesetzt."
      delays:
        start: 0
        duration: 60
        end: 6
    # Message sent when you are an original player.
    premium-login:
      title: ""
      subtitle: "<#F2C14E>Dein Account ist original, du wurdest eingeloggt."
      delays:
        start: 0
        duration: 60
        end: 6
    # Message sent when a login session is continued.
    plugin-reload:
      title: ""
      subtitle: "<#5EC26A>Die Konfiguration und die Sprach Dateien wurden neugeladen."
      delays:
        start: 0
        duration: 60
        end: 6
    # Message sent from backup system.
    backup:
      title: ""
      subtitle: "<#5EC26A>Backup wurde erfolgreich ausgeführt."
      delays:
        start: 0
        duration: 90
        end: 6
    # Message sent from backup system.
    backup-error:
      title: ""
      subtitle: "<#E0575B>Backup konnte nicht ausgeführt werden."
      delays:
        start: 0
        duration: 90
        end: 6
    # Message sent from security system.
    security-warning:
      title: ""
      subtitle: "<#E0575B>Eine neue Sicherheits Nachricht wurde in den Chat gesendet"
      delays:
        start: 0
        duration: 60
        end: 6

  action-bar:
    # Message sent on the player's actionbar before login (singular).
    singular: "<#E0575B>Du hast {0} Sekunde für's {login/register}."

    # Message sent on the player's actionbar before login (plural).
    plural: "<#E0575B>Du hast {0} Sekunden für's {login/register}."

  delay-kick:
    # Message sent when a user takes a long time to register.
    register-kick: "<#E0575B>Du hast zu lange gebraucht um dich zu registrieren."

    # Message sent when a user takes a long time to log in.
    login-kick: "<#E0575B>Du hast zu lange gebraucht um dich einzuloggen."

  successful-operations:
    # Message when a user exchanges their password.
    password-changed: "<#5EC26A>Dein Passwort wurde erfolgreich geändert."

    # Message sent when a user successfully logs.
    successful-login: "<#5EC26A>Du hast dich erfolgreich eingeloggt."

    # Message sent when a user logs in with an original account.
    successful-premium-login: "<#5EC26A>Du wurdest automatisch eingeloggt, da du einen originalen Account benutzt."

    # Message sent when a user logs in using the same ip address.
    successful-session-login: "<#5EC26A>Deine Login Session wurde erfolgreich fortgesetzt."

    # Message sent when a user successfully registers.
    successful-register: "<#5EC26A>Du hast dich erfolgreich registriert."

    # Message sent when you force a player's login.
    forcelogin: "<#F2C14E>Du hast einen Zwangs-Login an {0} ausgeführt."

    # Message sent when a player successfully unregister.
    unregister-kick: "<#E0575B>Du hast dich erfolgreich entregistriert."

    # Message sent when a configuration is finished
    config-finished: "<#5EC26A>Konfiguration wurde fertig gestellt."

    # Message sent when a configuration is cancelled
    config-cancelled: "<#E0575B>Aktion abgebrochen."

  kick-messages:
    # Message when a player tries to log on to the server with a small difference in the nickname.
    nick-already-registered: "<#E0575B>Du kannst mit diesem Nicknamen nicht beitreten <nickname>\n<#E0575B>Dieser Nickname wurde bereits als <realname> registriert\n\n<#E0575B>Um beizutreten, musst du deinen Nicknamen in Groß- und Kleinbuchstaben schreiben."

    # Message sent when a user misses many times.
    failed-many-times: "<#E0575B>Du hast ein falsches Passwort eingegeben."

    # Message sent when password entered is incorrect.
    incorrect-password: "<#E0575B>Falsches Passwort. Bitte versuche es erneut."

    # Message sent when the security questions answer is incorrect.
    incorrect-answer: "<#E0575B>Falsche Antwort. Bitte versuche es erneut."

    # Message sent when server is still starting.
    wait-server-start: "<#E0575B>Der Server wurde noch nicht vollständig gestartet.\n<#E0575B>Warte bis zu dich verbinden kannst."

    # Message sent when an IP is blocked by suspected invasion.
    account-blocked: "<#E0575B>Deine Adresse wurde wegen verdächtiger Invasion gesperrt.\n<#E0575B>Verbleibende Zeit: {0}"

    # Message sent when two-factor system temporary password is incorrect.
    incorrect-temporary-password: "<#E0575B>Falsches Passwort. Bitte versuche es erneut."

    # Message to kick a user with an invalid nickname.
    invalid-nickname: "<#E0575B>Dein Nickname ist nicht gültig, entferne Leerzeichen, Symbole, und ungültige Zeichen von deinem Namen."

    # Message sent when the player's account has already been registered as unique.
    premium-account: "<#E0575B>Tut uns leid, aber ein Premium Spieler hat sich mit diesem Namen schon registriert.\n<#E0575B>Um auf dem Server spieln zu können, musst du deinen Namen ändern.\n\nFalls du der Besitzer von dem Account bist, versuche Minecraft neuzustarten."

  security-messages:
    # Message sent when a user was protected by the heuristic system.
    hacking-attack-warning:
      - ""
      - " <#E0575B><bold>SICHERHEITS ALARM"
      - " <#E0575B>Das Sicherheitssystem hat einen möglichen Hacking Angriff auf deinen Account geblockt."
      - " <#E0575B>Drei fehlgeschlagene Login Versuche wurden ausgeführt."
      - ""
      - " <#F2C14E><bold>Tipp: <#F2C14E>Benutze ein anderes Passwort als von anderen Servern."
      - ""

    # Message sent when a user was protected more than once by the heuristic system.
    hacking-attack-warning2:
      - ""
      - " <#E0575B><bold>SICHERHEITS ALARM"
      - " <#E0575B>Das Sicherheitssystem hat {0} mögliche Hacking Angriffe auf deinen Account geblockt."
      - " <#E0575B>Drei fehlgeschlagene Login Versuche wurden ausgeführt."
      - ""
      - " <#F2C14E><bold>Tipp: <#F2C14E>Benutze ein anderes Passwort als von anderen Servern."
      - ""

    # Message sent when a user uses a weak password.
    weak-password:
      - ""
      - " <#E0575B>Das registrierte Passwort wurde als ein unsicheres erkannt."
      - " <#E0575B>Benutze Buchstaben, Zahlen und Symbole um die Sicherheit zu steigern."
      - " <#E0575B>Beispiel Passwort: {0}"
      - ""

    # Message sent when a player has not yet registered the security questions.
    security-question-warn-message:
      - ""
      - " <#E0575B><bold>SICHERHEITS FRAGEN"
      - " <#A0A0B0>Klick auf diese Nachricht um"
      - " <#E0575B>Sicherheits Fragen zu registrieren<#A0A0B0>. Damit verringerst"
      - " <#A0A0B0>du die Chance gehackt zu werden."
      - ""

    # Message sent when a security question is being added.
    security-question-add:
      - ""
      - " <#F2C14E>{0}"
      - ""
      - " <#A0A0B0>Benutze [white]'cancel' <#A0A0B0>um die Aktion abzubrechen."
      - " <#A0A0B0>Klick auf die Nachricht um eine weitere Frage zu generieren."
      - ""

    # Message sent when a security question should be reviewed.
    security-question-check:
      - ""
      - " <#5EC26A>Bevor du zustimmst, lies die Information:"
      - ""
      - " <#A0A0B0>{0}: [white]'{1}'"
      - ""
      - " <#5EC26A>Falls du dir sicher bist, schreib [white]'confirm'<#5EC26A>."
      - " <#F2C14E>Falls du etwas falsch eingegeben hast, schreib [white]'repeat'<#F2C14E>."
      - " <#E0575B>Falls du die Aktion abbrechen möchtest, schreib [white]'cancel'<#E0575B>."
      - ""

    # Message sent when security questions are requested.
    security-question-request:
      - ""
      - " <#5EC26A>Tut uns leid, aber eine Identitäts Bestätigung ist erforderlich."
      - " <#5EC26A>Beantworte die folgende Frage:"
      - ""
      - " <#56CCF2>{0}"
      - ""

    # Message sent when security questions are requested a second time.
    security-question-request2:
      - "<#5EC26A>Nächste Frage..."
      - ""
      - " <#56CCF2>{0}"
      - ""

  error-messages:
    # Message sent when you are already logged in.
    already-login: "<#E0575B>Du bist bereits eingeloggt."

    # Message sent when a user is already logged in.
    already-login2: "<#E0575B>Dieser Spieler ist bereits eingeloggt."

    # Message sent when a nickname has already been registered.
    already-registered: "<#E0575B>Dieser Nickname wurde bereits registriert."

    # Message sent when a nickname has not yet been registered.
    not-registered: "<#E0575B>Dieser Nickname wurde noch nicht registriert."

    # Message sent when the entered password is not equal to the second.
    passwords-dont-match: "<#E0575B>Die Passwörter sind nicht gleich."

    # Message sent when a player does not confirm your password.
    need-password-confirmation: "<#E0575B>Du musst dein Passwort bestätigen."

    # Message sent when a user does not have a temporary password.
    no-temporary-password: "<#E0575B>Ein temporäres Passwort wurde noch nicht generiert."

    # Message sent when IP limits per player pass the limit.
    address-limiter-warning: "<#E0575B>Du hast die Grenzen von deiner IP-Adresse ausgelastet."

    # Message sent when a player tries to change password by entering the same password as the current.
    password-same-as-old: "<#E0575B>Das eingegebene Passwort ist dein derzeitiges Passwort."

    # Message sent when the password entered is too large.
    password-too-large: "<#E0575B>Das eingegebene Passwort ist zu groß."

    # Message sent when the password entered is too small.
    password-too-small: "<#E0575B>Das eingegebene Passwort ist zu klein."

    # Message sent when a user attempts to disable nLogin using PlugMan/System.
    plugman-block: "<#E0575B>Du kannst das Plugin damit nicht berühren."

    # Message when a player does not possess the required permission.
    insufficient-permissions: "<#E0575B>Du hast keine Rechte diesen Befehl auszuführen. <#A0A0B0>(<permission>)"

    # Message to show the use of a command.
    command-usage: "<#E0575B>Du musst {0} benutzen."

    # Message to kick a player now online.
    already-online: "<#E0575B>Dieser Spieler ist bereits online."

    # Message to display that a player is not online.
    offline-error: "<#E0575B>Dieser Spieler ist offline."

    # Message to show that the command cannot be executed via console.
    player-command-usage: "<#E0575B>Dieser Befehl wurde von der Konsole deaktiviert."

    # Message to show that a command can only be executed by the console.
    console-command-usage: "<#E0575B>Dieser Befehl kann nur von der Konsole ausgeführt werden."

    # Message shown when the plugin is reloaded.
    plugin-reload-message: "<#F2C14E>Das Plugin wurde erfolgreich neugeladen."

    # Message shown when the function of a command is disabled.
    command-function-disabled: "<#E0575B>Die Funktion von dem Befehl {0} wurde deaktiviert."

    # Message sent when a database operation has not been successfully performed.
    database-error: "<#E0575B>Tut uns leid, wir konnten die Aktion nicht vervollständigen. Bitte versuche es erneut. [SQL FEHLER]"

  other-messages:
    # Hover message: /login.
    hover-message-login: "<#A0A0B0>Klick hier um den Befehl zu vervollständigen und dich schneller einzuloggen."

    # Hover message: /register.
    hover-message-register: "<#A0A0B0>Klick hier um den Befehl zu vervollständigen und dich schneller zu registrieren."

    # Command usage: /login
    message-login: "<#F2C14E>Benutze <#A0A0B0>/login [Passwort]<#F2C14E>."

    # Command usage: /register
    message-register: "<#F2C14E>Benutze <#A0A0B0>/register [Passwort] [Passwort]<#F2C14E>."

    # Command usage: /changepassword
    message-changepassword: "<#F2C14E>Benutze <#A0A0B0>/changepassword [derzeitiges Passwort] [neues Passwort]<#F2C14E>."

    # Command usage: /checkprofile
    message-verify: "<#F2C14E>Benutze <#A0A0B0>/checkprofile [Spieler]<#F2C14E>."

    # Command usage: /unregister
    message-unregister: "<#F2C14E>Benutze <#A0A0B0>/unregister [derzeitiges Passwort]<#F2C14E>."