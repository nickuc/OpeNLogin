# Discord: https://www.nickuc.com/discord

# Chinese version (with some small detail change!) translated by SnowCutieOwO
# Contact in SpigotMC: https://www.spigotmc.org/members/snowcutieowo.849243/

Messages:
  Title:
    # Message sent before login
    before-login:
      title: "<gradient:#7F5AF0:#2CB67D><bold>欢迎!</bold></gradient>"
      subtitle: "<#A0A0B0>输入 <#5EC26A>/login [密码] <#A0A0B0>来登录!"
      delays:
        start: 0
        duration: 9999
        end: 6
    # Message sent before registration
    before-register:
      title: "<gradient:#7F5AF0:#2CB67D><bold>欢迎!</bold></gradient>"
      subtitle: "<#A0A0B0>输入 <#5EC26A>/register [密码] [重复密码] <#A0A0B0>来注册!"
      delays:
        start: 0
        duration: 9999
        end: 6
    # Message sent after login
    after-login:
      title: ""
      subtitle: "<#5EC26A>你已成功登录!"
      delays:
        start: 0
        duration: 60
        end: 6
    # Message sent after register
    after-register:
      title: ""
      subtitle: "<#5EC26A>你已成功注册!"
      delays:
        start: 0
        duration: 60
        end: 6

  delay-kick:
    # Message sent when a user takes a long time to register
    register-kick: "<#E0575B>超出注册等待时间."

    # Message sent when a user takes a long time to log in
    login-kick: "<#E0575B>超出登录等待时间."

  successful-operations:
    # Message when a user exchanges their password
    password-changed: "<#5EC26A>你的密码已成功更换."

    # Message sent when a user successfully logs
    successful-login: "<#5EC26A>你已成功登录."

    # Message sent when a user successfully registers
    successful-register: "<#5EC26A>你已成功注册."

    # Message sent when a player successfully disregisters
    unregister-kick: "<#E0575B>你已成功登出."

  kick-messages:
    # Message when a player tries to log on to the server with a small difference in the nickname
    nick-already-registered: "[light_purple][大小写验证]\n<#E0575B>你不能使用名称 [dark_red]<nickname> <#E0575B>来注册\n<#E0575B>此用户名已被名称 [dark_red]<realname> <#E0575B>注册\n\n<#E0575B>请使用后者提到的用户名登入服务器\n[light_purple][大小写验证]"

    # Message sent when a user misses many times
    failed-many-times: "<#E0575B>你输入了错误的密码."

    # Message sent when password entered is incorrect
    incorrect-password: "<#E0575B>错误的密码. <#A0A0B0>请输入正确的密码."

  error-messages:
    # Message sent when you are already logged in.
    already-login: "<#E0575B>你已经登录过了."

    # Message sent when a nickname has already been registered.
    already-registered: "<#E0575B>此名称已被注册."

    # Message sent when a nickname has not yet been registered.
    not-registered: "<#E0575B>此名称还未被注册."

    # Message sent when the entered password is not equal to the second
    passwords-dont-match: "<#E0575B>前后密码不一致."

    # Message sent when a player tries to change password by entering the same password as the current
    password-same-as-old: "<#E0575B>此密码与旧密码相同."

    # Message sent when the password entered is too large
    password-too-large: "<#E0575B>密码长度过大."

    # Message sent when the password entered is too small
    password-too-small: "<#E0575B>密码长度过小."

    # Message when a player does not possess the required permission
    insufficient-permissions: "<#E0575B>你没有使用此命令的权限. <#A0A0B0>(<permission>)"

    # Message to kick a player now online
    already-online: "<#E0575B>此玩家已经在线."

    # Message to show that the command cannot be executed via console
    player-command-usage: "<#E0575B>此命令只能在控制台执行."

    # Message shown when the plugin is reloaded.
    plugin-reload-message: "<#A0A0B0>插件已被<#5EC26A>成功重载!"

    # Message sent when a database operation has not been successfully performed
    database-error: "<#E0575B>出错了! <#A0A0B0>插件运行过程中出现问题,请更改配置文件后重试. <#E0575B>(错误原因: 数据库连接不成功)"

  other-messages:
    # Mensagem enviada para o uso do comando /logar
    message-login: "<#F2C14E>请使用指令 /login [密码] 来登录"

    # Mensagem enviada para o uso do comando /register
    message-register: "<#F2C14E>请使用指令 /register [密码] [重复密码] 来注册"

    # Mensagem enviada para o uso do comando /mudarsenha
    message-changepassword: "<#F2C14E>请使用指令 /changepassword [当前密码] [新密码] 来更换密码"

    # Message sent to use the /unregister command
    message-unregister: "<#F2C14E>请使用指令 /unregister [当前密码] 来登出"
