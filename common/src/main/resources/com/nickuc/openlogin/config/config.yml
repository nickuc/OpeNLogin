# Official website: https://www.nickuc.com
# Discord: https://www.nickuc.com/discord

# Do not change this setting
file-version: 1

# Language of the plugin.
# For more information: https://github.com/nickuc-com/OpeNLogin/blob/master/docs/lang.md
languageFile: 'messages_en.yml'

# If enabled, each player will see messages in their own Minecraft client language.
# If disabled, all players will see messages in the server-wide language (languageFile).
perPlayerLocale: true

# Security system related settings.
Security:
  # Session timeout in milliseconds. Player is auto-logged in if they rejoin
  # within this time from the same IP. Default: 86400000 (24 hours).
  # Set to 0 to disable session system.
  session-timeout: 86400000

  # Amount of time for a player to log in/register (set in seconds).
  time-to-login: 45

  password:
    # Small password size.
    small: 5

    # Size for big passwords.
    large: 15