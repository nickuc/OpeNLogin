# Official Website: https://www.nickuc.com
# Discord: https://www.nickuc.com/discord

Messages:
  Title:
    # Message sent before login
    before-login:
      title: "<gradient:#7F5AF0:#2CB67D><bold>Dobrodošli!</bold></gradient>"
      subtitle: "<#A0A0B0>Koristite: /login [lozinka]"
      delays:
        start: 0
        duration: 9999
        end: 6
    # Message sent before registration
    before-register:
      title: "<gradient:#7F5AF0:#2CB67D><bold>Dobrodošli!</bold></gradient>"
      subtitle: "<#A0A0B0>Koristite: /register [lozinka] [lozinka]"
      delays:
        start: 0
        duration: 9999
        end: 6
    # Message sent after login
    after-login:
      title: ""
      subtitle: "<#5EC26A>Uspjeli ste se logirat!"
      delays:
        start: 0
        duration: 60
        end: 6
    # Message sent after register
    after-register:
      title: ""
      subtitle: "<#5EC26A>Uspjeli ste se logirat!"
      delays:
        start: 0
        duration: 60
        end: 6

  delay-kick:
    # Message sent when a user takes a long time to register
    register-kick: "<#E0575B>Previše vam je trebalo da se registrirate."

    # Message sent when a user takes a long time to log in
    login-kick: "<#E0575B>Previše vam je trebalo da se logirate."

  successful-operations:
    # Message when a user exchanges their password
    password-changed: "<#5EC26A>Uspješno ste promijenili lozinku."

    # Message sent when a user successfully logs
    successful-login: "<#5EC26A>Uspješno ste se logirali."

    # Message sent when a user successfully registers
    successful-register: "<#5EC26A>Uspješno ste se registrirali."

    # Message sent when a player successfully disregisters
    unregister-kick: "<#E0575B>Uspješno ste se iz-registrirali."

  kick-messages:
    # Message when a player tries to log on to the server with a small difference in the nickname
    nick-already-registered: "<#E0575B>Nemožete ući sa <nickname>\n<#E0575B>To ime je već registrirano kao <realname>\n\n<#E0575B>Da uđete morate koristit ime bez razlike u velikom i malom slovu"

    # Message sent when a user misses many times
    failed-many-times: "<#E0575B>Kriva lozinka."

    # Message sent when password entered is incorrect
    incorrect-password: "<#E0575B>Kriva lozinka, Pokušajte ponovno."

    # Message sent when a player enters an invalid nickname.
    invalid-nickname: "<#E0575B>Koristite ne-validno ime."

  error-messages:
    # Message sent when you are already logged in.
    already-login: "<#E0575B>Već ste logirani."

    # Message sent when a nickname has already been registered.
    already-registered: "<#E0575B>Ovo ime je već registrirano."

    # Message sent when a nickname has not yet been registered.
    not-registered: "<#E0575B>Ovo ime još nije registrirano."

    # Message sent when the entered password is not equal to the second
    passwords-dont-match: "<#E0575B>Lozinke nisu jednake."

    # Message sent when a player tries to change password by entering the same password as the current
    password-same-as-old: "<#E0575B>Upisana lozinka je ista kao prije."

    # Message sent when the password entered is too large
    password-too-large: "<#E0575B>Predugačka lozinka."

    # Message sent when the password entered is too small
    password-too-small: "<#E0575B>Lozinka je prekratka."

    # Message when a player does not possess the required permission
    insufficient-permissions: "<#E0575B>Nemate dozvolu za tu komandu. <#A0A0B0>(<permission>)"

    # Message to kick a player now online
    already-online: "<#E0575B>Ta osoba je već online."

    # Message to show that the command cannot be executed via console
    player-command-usage: "<#E0575B>Ova komanda je isključena putem konzole."

    # Message shown when the plugin is reloaded.
    plugin-reload-message: "<#F2C14E>Plugin je uspješno reloadan."

    # Message sent when a database operation has not been successfully performed
    database-error: "<#E0575B>Neuspješno smo pokrenuli ovu operaciju,molimo vas pokušajte ponovno [SQL FAIL]"

  other-messages:
    # Mensagem enviada para o uso do comando /logar
    message-login: "<#F2C14E>Koristi ovu komandu /login [lozinka]"

    # Mensagem enviada para o uso do comando /register
    message-register: "<#F2C14E>Koristi ovu komandu /register [lozinka] [lozinka]"

    # Mensagem enviada para o uso do comando /mudarsenha
    message-changepassword: "<#F2C14E>Koristi ovu komandu /changepassword [trenutna lozinka] [trenutna lozinka]"

    # Message sent to use the /unregister command
    message-unregister: "<#F2C14E>Koristi ovu komandu /unregister [trenutna lozinka]"